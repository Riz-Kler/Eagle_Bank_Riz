spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  main:
    allow-bean-definition-overriding: true
  mvc:
      servlet:
        path: /

# Let POST /v1/users/ be public in tests (SecurityConfig should already permit it)
eagle:
  security:
    allow-signup-without-auth: true

server:
  port: 0
servlet:
  context-path: /

# Logging during tests
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

